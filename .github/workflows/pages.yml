
name: Déployer comparateur 3D

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Compiler le comparateur
        run: npm run build

      - name: Télécharger les modèles anatomiques
        run: |
          mkdir -p dist/models
          curl -fL --retry 3 --max-time 180 'https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/anatomy.glb' -o dist/models/bodyexplorer.glb
          curl -fL --retry 3 --max-time 180 'https://raw.githubusercontent.com/organui/muscles-3d/main/public/models/muscles.glb' -o dist/models/organui.glb
          python3 - <<'PY'
          from pathlib import Path
          for name in ['bodyexplorer.glb', 'organui.glb']:
              b = Path('dist/models', name).read_bytes()
              assert b[:4] == b'glTF' and len(b) > 100_000, f'Modèle invalide: {name}'
              print(name, len(b), 'bytes, GLB OK')
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
